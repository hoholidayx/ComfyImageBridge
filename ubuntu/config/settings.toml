base_url = "http://127.0.0.1:8188"
data_dir = "data"
request_timeout = 60
poll_interval = 1
wait_timeout = 1200

[mcp]
# Set an explicit trusted LAN IPv4 address to allow remote clients.
host = "127.0.0.1"
port = 8787
max_pending_tasks = 8

[service]
comfy_dir = "~/workspace/ComfyUI"
run_script = "run_comfyui.sh"
# Empty: COMFY_UV_BIN, then PATH, then ~/.local/bin/uv.
uv_bin = ""

[retention]
max_tasks = 100
auto_cleanup = true
# Empty: derive from service.comfy_dir; cleanup is confined to these namespaces.
comfy_output_dir = ""
comfy_input_dir = ""

[sleep_guard]
enabled = true
poll_seconds = 2
idle_grace_seconds = 10

[monitor]
sample_seconds = 15
probe_timeout_seconds = 5
failure_samples = 3
recovery_samples = 3
reminder_seconds = 1800
temp_warning_margin = 10
temp_critical_margin = 5

[monitor.smtp]
# Copy smtp.example.toml here on the Ubuntu host and chmod 600 the file.
secret_file = "~/.config/myhermes2comfy/smtp.toml"
