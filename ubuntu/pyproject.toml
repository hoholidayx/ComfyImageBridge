[project]
name = "comfy-workflow-api"
version = "0.6.1"
description = "Standalone SDK and CLI for saved ComfyUI workflows"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
comfy-workflow = "comfy_workflow_api.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_workflow_api"]
